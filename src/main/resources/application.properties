spring.application.name=mexico-lindo-backend
server.port=8080

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mexico_lindo_tours?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT
# Sin valor por defecto a proposito: la app no arranca sin JWT_SECRET.
# Generar uno con: openssl rand -base64 64
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.mexicolindotours=DEBUG

# Blog: almacenamiento de imagenes destacadas
app.uploads.dir=${UPLOADS_DIR:uploads}
app.uploads.url-publica=/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Reservas: plazo para subir el comprobante antes de liberar los asientos
app.reservas.horas-para-pagar=${RESERVAS_HORAS_PARA_PAGAR:48}
app.reservas.intervalo-limpieza-ms=3600000
app.reservas.porcentaje-anticipo=${RESERVAS_PORCENTAJE_ANTICIPO:50}

# Notificaciones por correo (OPCIONAL). Sin habilitar, todo se registra en el log.
app.notificaciones.habilitado=${NOTIFICACIONES_HABILITADO:false}
app.notificaciones.remitente=no-reply@mexicolindotours.com
app.notificaciones.correo-operacion=${NOTIFICACIONES_CORREO_OPERACION:}
# Para activarlas, habilitar arriba y configurar el SMTP:
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Origenes permitidos para el sitio publico y el panel (separados por coma)
app.cors.origenes=${CORS_ORIGENES:http://localhost:*,http://127.0.0.1:*}
