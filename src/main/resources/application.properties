spring.application.name=mexico-lindo-backend
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/mexico_lindo_tours?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Tokai
spring.jpa.hibernate.ddl-auto=update

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT
jwt.secret=mk_secret_key_change_in_production_at_least_256_bits_long_for_security
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.mexicolindotours=DEBUG
