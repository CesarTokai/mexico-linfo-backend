# Nombre explicito del proyecto. Sin esto, Compose usa el de la carpeta
# ('backend'), que colisionaria con cualquier otro proyecto del servidor
# que tambien viva en una carpeta llamada 'backend' (SIGMAV2, por ejemplo).
name: mexicolindo

services:

  mexicolindo_db:
    image: mysql:8.0
    container_name: mexicolindo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-mexico_lindo_tours}
      MYSQL_USER: ${DB_USER:-mexicolindo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - mexicolindo_mysql:/var/lib/mysql
    # Solo accesible desde el propio servidor, nunca expuesto a la red.
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mexicolindo

  mexicolindo_backend:
    build: .
    container_name: mexicolindo_backend
    restart: unless-stopped
    depends_on:
      mexicolindo_db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mexicolindo_db:3306/${DB_NAME:-mexico_lindo_tours}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER:-mexicolindo}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      # La app no arranca sin esto. Generar: openssl rand -base64 64
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:*}
      UPLOADS_DIR: /app/uploads
      RESERVAS_HORAS_PARA_PAGAR: ${RESERVAS_HORAS_PARA_PAGAR:-48}
      RESERVAS_PORCENTAJE_ANTICIPO: ${RESERVAS_PORCENTAJE_ANTICIPO:-50}
      NOTIFICACIONES_HABILITADO: ${NOTIFICACIONES_HABILITADO:-false}
      NOTIFICACIONES_CORREO_OPERACION: ${NOTIFICACIONES_CORREO_OPERACION:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      # Las imagenes del blog y los comprobantes deben sobrevivir al redespliegue.
      - mexicolindo_uploads:/app/uploads
    ports:
      - "127.0.0.1:8083:8080"
    networks:
      - mexicolindo

volumes:
  mexicolindo_mysql:
  mexicolindo_uploads:

networks:
  mexicolindo:
    driver: bridge
